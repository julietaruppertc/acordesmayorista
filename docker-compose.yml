name: acordes-mayorista

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: services/auth-service/.env
    volumes:
      - type: bind
        source: ./shared/keys/private.pem
        target: /app/shared/keys/private.pem
        read_only: true
    networks: [backend]

  core-service:
    build:
      context: ./services/core-service
    env_file: services/core-service/.env
    environment:
      ENABLE_PAYMENT_SIMULATOR: "true"
      RESERVATION_TTL_MINUTES: 5
    networks: [backend]

  outbox-worker:
    image: acordes-mayorista-core-service:latest
    env_file: services/core-service/.env
    environment:
      OUTBOX_POLL_INTERVAL_SECONDS: 5
      OUTBOX_MAX_ATTEMPTS: 3
    command: [node, src/workers/outboxWorker.js]
    restart: unless-stopped
    depends_on:
      - core-service
    networks: [backend]

  reservation-expirer:
    image: acordes-mayorista-core-service:latest
    env_file: services/core-service/.env
    environment:
      DATABASE_SSL: "true"
      RESERVATION_JOB_INTERVAL_SECONDS: 30
    command: [node, src/jobs/expireReservations.js]
    restart: unless-stopped
    depends_on:
      - core-service
    networks: [backend]

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4001
      CORE_SERVICE_URL: http://core-service:4002
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_KEY_PATH: /app/shared/keys/public.pem
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - core-service
    networks: [backend]

networks:
  backend:
